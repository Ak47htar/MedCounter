name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write   # lets the job publish the APK on the repository's Releases page

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Unpack the newest project zip
        shell: bash
        run: |
          ZIP=""
          while IFS= read -r f; do
            if [ -n "$f" ] && [ -f "$f" ]; then ZIP="$f"; break; fi
          done < <(git -c core.quotepath=off log --name-only --diff-filter=AM --format= -- '*.zip')
          [ -n "$ZIP" ] || ZIP="$(find . -maxdepth 1 -name '*.zip' | head -n 1)"
          echo "Using zip: $ZIP"
          sha256sum "$ZIP"
          rm -rf project && mkdir -p project
          unzip -q "$ZIP" -d project
          ROOT="$(dirname "$(find project -name settings.gradle.kts | head -n 1)")"
          echo "Project root: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare the Android SDK
        shell: bash
        run: |
          # GitHub's ubuntu-24.04 image already contains the Android SDK (including platform android-36.1 and
          # build-tools 36.x), so no extra action is needed. Just accept the licences so Gradle may use it.
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://github.com/gradle/gradle-distributions/releases/download/v9.3.1/gradle-9.3.1-bin.zip \
            || curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$HOME"
          echo "$HOME/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Build the APK
        shell: bash
        working-directory: ${{ env.ROOT }}
        run: |
          gradle --version
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Show the real error
        if: failure()
        shell: bash
        working-directory: ${{ env.ROOT }}
        run: |
          if [ ! -f build.log ]; then echo "::error::The build never started - see the earlier steps for the reason."; exit 0; fi
          PATTERN='^e: |error:|FAILURE: Build failed|What went wrong|Execution failed for task|Could not (resolve|find|determine|get)|AAPT|Manifest merger|Unresolved reference|Caused by:'
          {
            echo "## Build failed"
            echo "Copy the box below and send it to your assistant."
            echo '```'
            grep -n -E "$PATTERN" build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: ' build.log | head -10 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=Kotlin error::${line}"; done
          sed -n '/What went wrong/,/Try:/p' build.log | head -15 | tr '\n' ' ' | sed 's/%/%25/g; s/^/::error title=Gradle::/'; echo

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: medtally-pro-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish the APK on the Releases page
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$ROOT"/app/build/outputs/apk/debug/*.apk MedTally-Pro-debug.apk
          gh release create "apk-${{ github.run_number }}-${{ github.run_attempt }}" MedTally-Pro-debug.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "MedTally Pro APK (build ${{ github.run_number }})" \
            --notes "Debug-signed APK built by GitHub Actions. Open this page on your phone and tap MedTally-Pro-debug.apk to download it."

      - name: Upload the full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.ROOT }}/build.log
          if-no-files-found: ignore
